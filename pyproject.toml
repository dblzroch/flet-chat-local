[project]
name = "flet-chat-local"
version = "0.1.0"
description = "Local LLM chat client for Ollama with streaming and conversation history"
requires-python = ">=3.12"
dependencies = [
    "flet>=0.18.0",
    "httpx>=0.27.0",
]

[project.scripts]
flet-chat-local = "py_flet_chat_local.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_flet_chat_local"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "respx>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing --cov-fail-under=80"
